name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-tests:
    name: Backend unit + API tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: company/backend

    env:
      PYTHONPATH: .
      HF_HUB_OFFLINE: "1"
      HF_LOCAL_FILES_ONLY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Show installed test stack
        run: |
          python -m pip list | grep -E "pytest|coverage|fastapi|sqlalchemy|transformers|torch|accelerate" || true

      - name: Run backend unit and API tests
        run: |
          python -m pytest -q \
            app/tests/unit/test_identity_validation.py \
            app/tests/api/test_foundation.py \
            app/tests/unit/test_security_and_seed.py \
            app/tests/api/test_auth_and_portal.py \
            app/tests/unit/test_otp_validators_extra.py \
            app/tests/unit/test_otp_service.py \
            app/tests/api/test_otp_api.py \
            app/tests/unit/test_nlp_thresholds.py \
            app/tests/unit/test_nlp_inference.py

  nlp-tool-tests:
    name: NLP startup + smoke tool tests
    runs-on: ubuntu-latest
    needs: backend-tests

    defaults:
      run:
        working-directory: company/backend

    env:
      PYTHONPATH: .
      HF_HUB_OFFLINE: "1"
      HF_LOCAL_FILES_ONLY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Check whether NLP artifacts exist
        id: nlp_artifacts
        run: |
          if [ -f app/assets/nlp_models/distilbert-specialty/config.json ] && \
             [ -f app/assets/nlp_models/distilbert-specialty/label_to_id.json ] && \
             [ -f app/assets/nlp_models/distilbert-specialty/thresholds.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run NLP artifact check
        if: steps.nlp_artifacts.outputs.exists == 'true'
        run: python tools/check_nlp_artifacts.py

      - name: Run NLP evaluation output check
        if: steps.nlp_artifacts.outputs.exists == 'true'
        run: python tools/check_nlp_eval_outputs.py

      - name: Run NLP startup check
        if: steps.nlp_artifacts.outputs.exists == 'true'
        run: python tools/check_nlp_startup.py

      - name: Run NLP smoke test
        if: steps.nlp_artifacts.outputs.exists == 'true'
        run: python tools/smoke_test_nlp.py

      - name: Skip NLP tool tests when artifacts are absent
        if: steps.nlp_artifacts.outputs.exists != 'true'
        run: |
          echo "NLP model artifacts are not present in the repo."
          echo "Skipping startup/smoke tool tests in GitHub-hosted CI."